# This is a basic workflow to help you get started with Actions
name: phpcs

permissions:
  contents: read


# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    paths-ignore:
      - '.agents/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.agents/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


concurrency:
  group: phpcs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # actionlint reads the workflow files themselves: expressions, contexts, action inputs, matrix
  # keys. Pinned, so an upstream release never turns this job red on its own.
  ACTIONLINT_VERSION: 1.7.7

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
         fetch-depth: '0'
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          # The three tools below parse PHP, they do not run it: an extension listed here only makes
          # the runner build an extension that no check ever loads.
          extensions: mbstring, xml
          tools: php-parallel-lint/php-var-dump-check, parallel-lint, cs2pr, phpcs
      - name: What the change touches
        # phpcs reads every PHP file of the repository, and that grows with each module added. On a
        # pull request the files of the pull request are enough: what lands on main is checked
        # whole, and so is a change to the ruleset, which can turn a file nobody touched red.
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "workflows=yes" >> "$GITHUB_OUTPUT"
            echo "The whole repository is checked."
            exit 0
          fi
          base=$(git merge-base "$PR_BASE_SHA" HEAD)
          git diff --name-only --diff-filter=ACMR "$base" HEAD > changed.txt
          echo "Files of the pull request:"
          cat changed.txt
          if grep -qE '^(dev/setup/codesniffer/|\.github/workflows/phpcs\.yml$)' changed.txt; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "The ruleset itself changed: the whole repository is checked."
          else
            grep -E '\.php$' changed.txt > changed-php.txt || true
            if [ -s changed-php.txt ]; then
              echo "mode=list" >> "$GITHUB_OUTPUT"
            else
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "No PHP file changed."
            fi
          fi
          if grep -qE '^\.github/' changed.txt; then
            echo "workflows=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Run PHPCS
        if: ${{ steps.scope.outputs.mode == 'all' }}
        run: phpcs -q --report=checkstyle --standard=dev/setup/codesniffer/ruleset.xml --extensions=php --ignore=*/tx/*,*/vendor/*,dev/tools/phan/* . | cs2pr --graceful-warnings
      - name: Run PHPCS on the files of the pull request
        if: ${{ steps.scope.outputs.mode == 'list' }}
        run: phpcs -q --report=checkstyle --standard=dev/setup/codesniffer/ruleset.xml --extensions=php --ignore=*/tx/*,*/vendor/*,dev/tools/phan/* --file-list=changed-php.txt | cs2pr --graceful-warnings
      - name: Run VarDump Check
        run: var-dump-check --extensions php --tracy --exclude */vendor/* .
      - name: Run Parallel Lint
        run: parallel-lint --exclude einvoicing/vendor/ --exclude dev/tools/phan/stubs/ .
      - name: Lint the workflow files
        # shellcheck is left out on purpose: it reports on the shell of every run block, which is
        # not what this step is here for. What it checks is the workflow itself - an expression on
        # a context that does not exist, an input an action does not take, a key YAML reads twice.
        if: ${{ steps.scope.outputs.workflows == 'yes' }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -shellcheck= -pyflakes=
          echo "The workflow files are well formed."
